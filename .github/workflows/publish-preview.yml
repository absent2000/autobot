name: Publish Astro preview
on:
  push:
    branches: [astro-site]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main}
      - uses: actions/checkout@v4
        with: {ref: astro-site, path: astro}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: astro
        run: npm install
      - working-directory: astro
        env: {CARS24_PREVIEW_BASE: /autobot/preview}
        run: npm run build
      - run: |
          rm -rf main/preview
          mkdir -p main/preview
          rsync -a astro/dist/ main/preview/
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git diff --cached --quiet || (git commit -m "Publish Cars24 WordPress-faithful preview" && git push origin main)
