name: Publish Astro preview

on:
  push:
    branches: [astro-site]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cars24-preview-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy

      - name: Checkout Astro site
        uses: actions/checkout@v4
        with:
          ref: astro-site
          path: astro

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: astro
        run: npm install

      - name: Build preview
        working-directory: astro
        env:
          CARS24_PREVIEW_BASE: /autobot/preview
        run: npm run build

      - name: Publish preview into main
        run: |
          rm -rf legacy/preview
          mkdir -p legacy/preview
          rsync -a astro/dist/ legacy/preview/
          touch legacy/.nojekyll
          cd legacy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview .nojekyll
          if git diff --cached --quiet; then
            echo "Preview already up to date"
          else
            git commit -m "Publish Cars24 Astro preview"
            git push origin main
          fi
