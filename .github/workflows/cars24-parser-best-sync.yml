name: Cars24 Parser Best Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cars24-parser-best-sync.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cars24-parser-best-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cars24-parser-best"             | jq -r '.value')"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sync parser.best
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error             --max-time 55             -w $'\n%{http_code}'             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data '{"max_pages":4}'             "https://pmjachoteyeviwwzotks.supabase.co/functions/v1/parser-best-sync")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "HTTP $status" >&2
            exit 1
          fi
