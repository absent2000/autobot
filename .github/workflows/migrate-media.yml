name: Migrate bot media to Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-media.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repoint media URLs and remove repository photos
        shell: python
        run: |
          from pathlib import Path
          old = 'https://raw.githubusercontent.com/absent2000/autobot/main/Photos/'
          new = 'https://pmjachoteyeviwwzotks.supabase.co/storage/v1/object/public/cars24-media/autobot/'
          for name in ('cars.json', 'motos.json'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
              print(f'{name}: replaced {count} media URLs')

      - name: Remove migrated photos
        run: git rm -r Photos

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cars.json motos.json
          git commit -m "Move bot media to Supabase Storage"
          git push
