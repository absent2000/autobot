name: Cars24 Astro preview publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cars24-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy main
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy

      - name: Checkout Astro branch
        uses: actions/checkout@v4
        with:
          ref: astro-site
          path: astro

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Astro dependencies
        working-directory: astro
        run: npm install

      - name: Build Astro preview
        working-directory: astro
        env:
          CARS24_PREVIEW_BASE: /autobot/preview
        run: npm run build

      - name: Write preview into main branch
        run: |
          rm -rf legacy/preview
          mkdir -p legacy/preview
          rsync -a astro/dist/ legacy/preview/
          cd legacy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then
            echo "Preview already up to date"
          else
            git commit -m "Publish Cars24 Astro preview"
            git push origin main
          fi
